# LFM2.5-350M Hindi/Hinglish SFT Configuration
# Usage: python3.13 scripts/run_sft.py --config configs/sft_config.yaml

model_name_or_path: "LiquidAI/LFM2.5-350M-Base"
dataset_paths:
  - "data/validated/sft_train.jsonl"
eval_dataset_path: "data/validated/sft_val.jsonl"

# LoRA configuration
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - "self_attn.q_proj"
  - "self_attn.k_proj"
  - "self_attn.v_proj"
  - "self_attn.out_proj"   # NOTE: LFM2 uses out_proj, NOT o_proj
  - "feed_forward.w1"
  - "feed_forward.w2"
  - "feed_forward.w3"
  - "conv.in_proj"
  - "conv.out_proj"

# Training hyperparameters
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
weight_decay: 0.01
max_seq_length: 1024
packing: false

# Mixed precision (set bf16=True if GPU supports it)
bf16: true
fp16: false

# Output & logging
output_dir: "output/sft_lora"
logging_steps: 20
save_strategy: "steps"
save_total_limit: 3
save_steps: 500
eval_strategy: "epoch"
report_to: "tensorboard"
seed: 42

# Early stopping (optional)
# early_stopping_patience: 3
