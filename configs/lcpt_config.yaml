# LFM2.5-350M Continued Pretraining (LCPT) Configuration
# Usage: python3.13 scripts/run_lcpt.py --config configs/lcpt_config.yaml

model_name_or_path: "LiquidAI/LFM2.5-350M-Base"
dataset_path: "data/validated/lcpt_corpus.txt"

num_train_epochs: 2
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
lr_scheduler_type: "cosine"
warmup_ratio: 0.05
weight_decay: 0.01
max_seq_length: 1024

bf16: true
fp16: false

output_dir: "output/lcpt"
logging_steps: 50
save_strategy: "epoch"
report_to: "tensorboard"
seed: 42
