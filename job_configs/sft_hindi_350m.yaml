# LEAP Finetune job: LFM2.5-350M-Base → Hindi/Hinglish SFT (LoRA)
# Run:  uv run leap-finetune job_configs/sft_hindi_350m.yaml
# Repo: https://github.com/Liquid4All/leap-finetune

project_name: "lfm25_350m_hindi_hinglish"
model_name: "LiquidAI/LFM2.5-350M-Base"
training_type: "sft"

dataset:
  path: "data/leap/sft_hindi_hinglish_train.jsonl"
  type: "sft"
  test_size: 0.05

training_config:
  extends: "DEFAULT_SFT"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  max_length: 1024
  bf16: true
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2

peft_config:
  extends: "DEFAULT_LORA"
  use_peft: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
